<svg width="240" height="240" viewBox="0 0 240 240" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Rust Starter mark</title>
  <desc id="desc">A minimal white abstract launch mark for the Rust Starter website.</desc>
  <defs>
    <radialGradient id="halo" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(120 120) rotate(90) scale(82)">
      <stop offset="0" stop-color="white" stop-opacity="0.34"/>
      <stop offset="0.45" stop-color="white" stop-opacity="0.11"/>
      <stop offset="1" stop-color="white" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mark" x1="76" y1="82" x2="160" y2="166" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="white"/>
      <stop offset="1" stop-color="#D9D9D9"/>
