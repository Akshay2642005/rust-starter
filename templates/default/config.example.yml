primary:
  env: development
  name: rust-starter

server:
  host: 0.0.0.0
  port: 8080
  read_timeout_secs: 30
  write_timeout_secs: 30
  idle_timeout_secs: 50
  request_timeout_secs: 300
  shutdown_timeout_secs: 30
  min_graceful_shutdown_secs: 5
  cors_allowed_origins: ["http://localhost:3000"]
  path_prefix: "/api/v1"

telemetry:
  service_name: rust-starter
  environment: development
  filter: info,rust_starter=trace
  format: compact
  ansi: true
  include_file: false
  include_line_number: false
  otlp:
    enabled: true
    endpoint: "http://localhost:4317"

auth:
  secret: "development-auth-secret-change-me-please"
  base_url: "http://localhost:8080"
  # Mounted under server.path_prefix, so this becomes /api/v1/auth.
  path_prefix: "/auth"
  # If you prefer a fully-qualified auth path, set it here and update
  # build_auth_mount_path to skip server.path_prefix composition.
  # path_prefix: "/api/v1/auth"
  enable_signup: true
  password_min_length: 8
  argon2:
    memory_cost: 19456
    time_cost: 2
    parallelism: 1

store:
  url: postgres://postgres:postgres@localhost:5432/rust_starter
  max_connections: 4
  min_connections: 1
  connect_timeout_secs: 30
  acquire_timeout_secs: 30
  idle_timeout_secs: 30
  max_lifetime_secs: 1800
  sqlx_logging: true
