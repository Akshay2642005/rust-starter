[package]
name = "rust-starter"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A Rust starter template for building production ready backend services"

# Define dependencies for the root package here.
[dependencies]

#uuid
uuid = "1.23.1"

# auth exclusive to package, not shared across the workspace
better-auth = { version = "0.10", features = ["sqlx-postgres", "axum"] }
argon2 = "0.5"

# Http
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }

# Error Handling
anyhow = { workspace = true }
thiserror = { workspace = true }

# Data Serialization and Deserialization
serde = { workspace = true }
serde_json = { workspace = true }

# Observability and Logging
tracing = { workspace = true }

# Async
tokio = { workspace = true }
async-trait = { workspace = true }

# Registry
inventory = {workspace = true }

# Date/Time
chrono = { workspace = true }

# OpenAPI
utoipa = { workspace = true }

# HTTP client
reqwest = { workspace = true }

# Workspace Crates
configuration = { workspace = true }
seaorm = { workspace = true }
telemetry = { workspace = true }
macros = { workspace = true }

# internal crates can be added here as dependencies for the root package,

[dev-dependencies]
sea-orm = { workspace = true, features = ["mock"] }

[workspace]
resolver = "3"
members = [
    "crates/configuration",
    "crates/seaorm",
    "crates/telemetry",
    "crates/macros",
    "tooling/xtask",
]
default-members = [
    ".",
    "crates/configuration",
    "crates/seaorm",
    "crates/telemetry",
    "crates/macros",
]

# Workspace package settings
[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"



# Workspace dependencies can be defined here and will be shared across all members of the workspace.
[workspace.dependencies]

# Error Handling
anyhow = "1"
thiserror = "1"

# CLI Tooling
clap = { version = "4", features = ["derive", "env"] }
xshell = "0.2"

# Configuration
arc-swap = "1.7.1"
config = { version = "0.15.22", default-features = false, features = ["toml","yaml"] }
dotenvy = "0.15"
notify = "8.2.0"

# Data Serialization and Deserialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Observability and Logging
log = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3.20", features = ["chrono", "env-filter", "fmt","json"] }
tracing-error = "0.2"
tracing-log = "0.2"
opentelemetry         = { version = "0.27" }
opentelemetry_sdk     = { version = "0.27", features = ["rt-tokio"] }
opentelemetry-otlp    = { version = "0.27", features = ["grpc-tonic"] }
opentelemetry-semantic-conventions = { version = "0.27" }
tracing-opentelemetry = { version = "0.28" }

# Async Runtime and Utilities
tokio = { version = "1.0", features = ["full"] }
async-trait = "0.1"
rand = "0.8"
sha2 = "0.10"
base64 = "0.22"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
argon2 = "0.5"

# Database and ORM
sea-orm           = { version = "1", features = [ "sqlx-postgres", "runtime-tokio-rustls", "macros", "with-chrono", "with-json", "with-uuid"] }
sea-orm-migration = { version = "1", features = [ "sqlx-postgres", "runtime-tokio-rustls" ] }

# sqlx = { version = "0.8.6", features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid"] }

# HTTP Libraries
axum = { version = "0.8", features = ["macros", "tracing", "multipart", "ws"] }
tower = { version = "0.5", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "compression-gzip", "timeout", "trace", "request-id", "sensitive-headers", "catch-panic", "set-header", "limit"] }
tower_governor = { version = "0.4", features = ["axum"] }
governor = "0.6"

# HTTP Utilities and Validation
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
validator = { version = "0.18", features = ["derive"] }
utoipa = { version = "4", features = ["axum_extras", "chrono", "uuid"] }
utoipa-scalar = { version = "0.1", features = ["axum"] }


# Proc macro
inventory = "0.3"
paste = "1"
proc-macro2 = "1"
quote = "1"
syn = {version = "2", features = ["full"] }


# Member Crates
configuration = { path = "crates/configuration"}
seaorm = { path = "crates/seaorm" }
telemetry = { path = "crates/telemetry" }
macros = { path = "crates/macros" }


# Profile settings for development and release builds. These settings can be overridden in individual member packages if needed.
[profile.dev]
opt-level = 0
debug = true
incremental = true

[profile.dev.package."*"]
opt-level = 1

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
