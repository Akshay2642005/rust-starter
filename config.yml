primary:
  env: development
  name: rust-starter

telemetry:
  service_name: rust-starter
  environment: development
  filter: info,tower_http=info,rust_starter=trace
  format: compact
  ansi: true
  include_file: false
  include_line_number: false
  otlp:
    enabled: true
    endpoint: "http://localhost:4317"

store:
  url: postgres://postgres:postgres@localhost:15432/rust_starter
  max_connections: 5
  min_connections: 1
  connect_timeout_secs: 30
  acquire_timeout_secs: 30
  idle_timeout_secs: 30
  max_lifetime_secs: 1800
  sqlx_logging: true
